<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f47"/>
      <stop offset="0.55" stop-color="#7a1f6b"/>
      <stop offset="1" stop-color="#ff5a8a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36e"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff477e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <circle cx="256" cy="300" r="120" fill="url(#sun)"/>
  <!-- sunset stripes across the sun -->
  <g fill="#2a0f47" opacity="0.85">
    <rect x="120" y="330" width="272" height="12" rx="6"/>
    <rect x="120" y="356" width="272" height="14" rx="7"/>
    <rect x="120" y="384" width="272" height="16" rx="8"/>
  </g>
  <!-- reflective horizon glow -->
  <rect x="64" y="416" width="384" height="10" rx="5" fill="#ffd36e" opacity="0.6"/>
  <rect x="112" y="436" width="288" height="8" rx="4" fill="#ff8a3d" opacity="0.45"/>
</svg>
